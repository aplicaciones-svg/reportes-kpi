<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Ejecutivo de KPIs</title>
<style>
    :root {
        --azul: #0f4bb4;
        --azul-claro: #eef4ff;
        --verde: #15803d;
        --verde-claro: #ecfdf5;
        --rojo: #b91c1c;
        --rojo-claro: #fef2f2;
        --texto: #1e293b;
        --texto-sec: #64748b;
        --borde: #e2e8f0;
        --fondo: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 0;
        background: var(--fondo);
        color: var(--texto);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
    }
    .contenedor {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 48px;
    }
    header.encabezado {
        margin-bottom: 24px;
    }
    header.encabezado h1 {
        font-size: 1.5rem;
        margin: 0 0 4px;
        color: var(--texto);
    }
    header.encabezado .subtitulo {
        color: var(--texto-sec);
        font-size: 0.9rem;
        margin: 0;
    }
    header.encabezado .consultado {
        color: var(--texto-sec);
        font-size: 0.85rem;
        margin: 6px 0 0;
    }
    .seccion-titulo {
        font-size: 1rem;
        font-weight: 700;
        color: var(--texto);
        margin: 32px 0 12px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--borde);
    }
    .kpi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 12px;
    }
    .kpi-card {
        background: #ffffff;
        border: 1px solid var(--borde);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .kpi-card .titulo {
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--texto-sec);
        margin: 0 0 8px;
    }
    .kpi-card .valor {
        font-size: 1.9rem;
        font-weight: 800;
        margin: 0 0 8px;
        line-height: 1.1;
    }
    .kpi-card .valor.positivo { color: var(--verde); }
    .kpi-card .valor.negativo { color: var(--rojo); }
    .kpi-card .detalle {
        font-size: 0.82rem;
        color: var(--texto-sec);
        margin: 2px 0;
    }
    footer.pie {
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid var(--borde);
        font-size: 0.78rem;
        color: var(--texto-sec);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px;
    }
    .estado-vacio {
        text-align: center;
        color: var(--texto-sec);
        padding: 48px 16px;
    }
    @media (max-width: 420px) {
        .kpi-card .valor { font-size: 1.6rem; }
        header.encabezado h1 { font-size: 1.3rem; }
    }
</style>
</head>
<body>
    <div class="contenedor" id="app">
        <div class="estado-vacio">Cargando reporte...</div>
    </div>

    <script>
        // Esta pagina se aloja UNA sola vez en un hosting estatico (GitHub
        // Pages) porque Supabase Storage se niega a servir archivos .html con su
        // Content-Type real (los fuerza a text/plain por seguridad, para evitar
        // que contenido subido por usuarios se ejecute como HTML bajo su dominio
        // compartido). Los DATOS de cada reporte si viven en Supabase (como
        // .json, que Supabase sirve correctamente) y esta pagina los pide por
        // fetch() usando el token que viene en su propia URL (?token=...).
        // NOTA: este archivo usa solo caracteres ASCII (entidades HTML para las
        // tildes) a proposito, para evitar problemas de codificacion al copiar y
        // pegar el contenido en el editor web de GitHub.
        const SUPABASE_URL = 'https://tbvkfbppzgsgacdyhqcn.supabase.co';
        const SUPABASE_BUCKET = 'ReportesSeguimientoOperativo';

        function formatPct(val) {
            const n = parseFloat(val) || 0;
            const signo = n > 0 ? '+' : '';
            return `${signo}${n.toFixed(2)}%`;
        }

        function claseTendencia(val) {
            return (parseFloat(val) || 0) >= 0 ? 'positivo' : 'negativo';
        }

        function render(data) {
            const app = document.getElementById('app');
            if (!data) {
                app.innerHTML = '<div class="estado-vacio">No se encontr&oacute; informaci&oacute;n para este reporte.</div>';
                return;
            }

            const ytd = data.crecimiento_ytd_info || {};
            const mensual = data.tendencia_mensual || {};
            const semanal = data.tendencia_semanal || {};
            const ytdClase = claseTendencia(data.crecimiento_ytd);
            const mesClase = claseTendencia(mensual.variacion_porcentual);
            const semClase = claseTendencia(semanal.variacion_porcentual);

            app.innerHTML = `
                <header class="encabezado">
                    <h1>Reporte Ejecutivo de KPIs</h1>
                    <p class="subtitulo">Metrolog&iacute;a &amp; Servicios &middot; Generado el ${data.generation_date || ''}</p>
                    <p class="consultado">Datos consultados: ${data.consulted_date || ''}</p>
                </header>

                <div class="seccion-titulo">Resumen de producci&oacute;n</div>
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <p class="titulo">Acumulado anual (${data.report_year} vs ${data.report_year - 1})</p>
                        <p class="valor ${ytdClase}">${formatPct(data.crecimiento_ytd)}</p>
                        <p class="detalle">${ytd.anio_actual || ''}: ${(ytd.total_actual || 0).toLocaleString('es-PE')} equipos</p>
                        <p class="detalle">${ytd.anio_anterior || ''}: ${(ytd.total_anterior || 0).toLocaleString('es-PE')} equipos</p>
                    </div>
                    <div class="kpi-card">
                        <p class="titulo">Mes actual (corte ${mensual.dia_corte || ''} ${mensual.mes || ''})</p>
                        <p class="valor ${mesClase}">${formatPct(mensual.variacion_porcentual)}</p>
                        <p class="detalle">${mensual.mes || ''} ${data.report_year}: ${(mensual.produccion_actual || 0).toLocaleString('es-PE')} equipos</p>
                        <p class="detalle">${mensual.mes || ''} ${data.report_year - 1}: ${(mensual.produccion_anterior || 0).toLocaleString('es-PE')} equipos</p>
                    </div>
                    <div class="kpi-card">
                        <p class="titulo">Semana actual (semana ${semanal.semana || ''})</p>
                        <p class="valor ${semClase}">${formatPct(semanal.variacion_porcentual)}</p>
                        <p class="detalle">Sem ${semanal.semana || ''} ${data.report_year}: ${(semanal.produccion_actual || 0).toLocaleString('es-PE')} equipos</p>
                        <p class="detalle">Sem ${semanal.semana || ''} ${data.report_year - 1}: ${(semanal.produccion_anterior || 0).toLocaleString('es-PE')} equipos</p>
                    </div>
                </div>

                <footer class="pie">
                    <span>Metrolog&iacute;a &amp; Servicios</span>
                    <span>Reporte generado el ${data.generation_date || ''}</span>
                </footer>
            `;
        }

        async function cargarYRenderizar() {
            const app = document.getElementById('app');
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            if (!token) {
                app.innerHTML = '<div class="estado-vacio">Falta el identificador del reporte en el link.</div>';
                return;
            }

            // Validacion basica del formato esperado del token (mismo patron que
            // genera secrets.token_urlsafe en el backend) -- solo para evitar
            // pedir una URL con caracteres raros, no es una medida de seguridad
            // (los datos igual son publicos de por si en el bucket).
            if (!/^[A-Za-z0-9_-]{16,64}$/.test(token)) {
                app.innerHTML = '<div class="estado-vacio">Link de reporte inv&aacute;lido.</div>';
                return;
            }

            const dataUrl = `${SUPABASE_URL}/storage/v1/object/public/${SUPABASE_BUCKET}/${encodeURIComponent(token)}.json`;

            try {
                const resp = await fetch(dataUrl);
                if (!resp.ok) {
                    app.innerHTML = resp.status === 404
                        ? '<div class="estado-vacio">Este reporte no existe o fue eliminado.</div>'
                        : '<div class="estado-vacio">No se pudo cargar el reporte (error de red).</div>';
                    return;
                }
                const snapshot = await resp.json();
                render(snapshot.data || snapshot);
            } catch (e) {
                console.error(e);
                app.innerHTML = '<div class="estado-vacio">Ocurri&oacute; un error cargando el reporte. Verifica tu conexi&oacute;n a internet.</div>';
            }
        }

        cargarYRenderizar();
    </script>
</body>
</html>
